[package]
name = "horizon-axiom-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Axiom server protocol for Horizon (no Horizon types): payload codecs, block buffers, restrictions, operations"

# Every dependency must already be in Horizon's Cargo.lock (horizon-mixins checks it).
[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Pure Rust zstd (decoder + fast encoder). Default features only pull twox-hash, which Horizon already locks.
ruzstd = "0.9"
