[package]
name = "mod-axiom"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The unchanged protocol core (codecs, buffers, restrictions, operations). No Horizon types.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Pure Rust zstd (decoder + fast encoder). Default features only pull twox-hash, which Horizon already locks.
ruzstd = "0.9"


[features]
default = []
# Code written against engine APIs that live in local branches (rec-player-misc: player_anti_xray_active).
next-engine = []
